[build-system]
requires = ["setuptools>=77", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "spear-registration"
version = "0.1.0"
description = "PyTorch implementation of error-guided sparse refinement for 3D deformable MRI registration"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hao Bai"}]
keywords = ["pytorch", "medical-imaging", "registration", "SPEAR", "MICCAI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "nibabel>=5.2,<6",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]
plots = ["matplotlib>=3.8,<4"]
datasets = ["SimpleITK>=2.3,<3"]

[project.scripts]
spear = "spear.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["spear*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
